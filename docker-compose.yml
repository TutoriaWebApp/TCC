services:
    mysql-image:
        container_name: mysql_db
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        image: mysql:8.0
        env_file: ./backend/env/.env
        environment:
            LANG: pt_BR.UTF-8
            LC_ALL: pt_BR.UTF-8
            TZ: America/Sao_Paulo
            MYSQL_DATABASE: tutoriadb
            MYSQL_HOST: mysql-image
            EMAIL_SENDER: BREVO
            EMAIL_HOST: smtp-relay.brevo.com
            EMAIL_PORT: 587
            EMAIL_USE_TLS: False
            EMAIL_HOST_USER: ${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - tcc-net

    django-image:
        build:
            context: ./backend/webapi-django
            dockerfile: Dockerfile
        container_name: django-api
        command: ["./wait-for-db.sh", "mysql-image", "3306", "${MYSQL_ROOT_PASSWORD}", "python", "manage.py", "runserver", "0.0.0.0:8000"]
        volumes:
            - ./backend/webapi-django:/app
            - ./backend/media:/app/media
        ports:
            - "8000:8000"
        depends_on:
            - mysql-image
        environment:
            DATABASE_HOST: 'mysql-image'
            DATABASE_PORT: '3306'
            DATABASE_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
            EMAIL_SENDER: ${EMAIL_SENDER}
            EMAIL_HOST: smtp-relay.brevo.com
            EMAIL_PORT: 587
            EMAIL_USE_TLS: False
            EMAIL_HOST_USER: ${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
        networks:
            - tcc-net

    frontend-web:
        build:
            context: ./frontend
            target: deps
        container_name: frontend_web
        command: pnpm --filter web dev
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/apps/web/node_modules
            - /app/packages/ui/node_modules
            - /app/packages/lib/node_modules
            - /app/packages/services/node_modules
            - /app/packages/config/node_modules
            - /app/apps/web/.next
        ports:
            - "3000:3000"
        depends_on:
            - django-image
        environment:
            - NODE_ENV=development
            - WATCHPACK_POLLING=true
            - BACKEND_BASE_URL=http://localhost:8000/v1
            - INTERNAL_BACKEND_URL=http://django-api:8000/v1
        networks:
            - tcc-net

networks:
    tcc-net:
        driver: bridge

volumes:
    db_data:
